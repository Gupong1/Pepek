name: Flutter Build and Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Analisis kode (cek error, warning, dan style)
  analyze:
    name: Analisis Kode (flutter analyze)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'   # atau '3.x' untuk versi terbaru

      - name: Install dependencies
        run: flutter pub get

      - name: Jalankan flutter analyze
        run: flutter analyze

  # 2. Jalankan unit test
  test:
    name: Jalankan Unit Test (flutter test)
    runs-on: ubuntu-latest
    needs: analyze  # opsional: jalankan setelah analyze selesai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Jalankan flutter test
        run: flutter test

  # 3. Build APK Android (release)
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [analyze, test]  # menunggu kedua job sebelumnya berhasil
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
